# Paths expand ~ using the process HOME. No credentials belong in this file.
state_dir = "~/.local/share/pacer-tokencheck"
port = 48829
poll_interval = 60
oauth_interval = 600
# Dedicated subscription login profile, separate from ~/.claude.
claude_config_dir = "~/.local/share/pacer-tokencheck/claude-usage-config"
# Renew that profile's access token ahead of expiry via `claude auth status` (no inference).
claude_auto_refresh = true
# Opt in only after setting up the selected local provider CLIs.
enabled_providers = []
grok_tmux_pane = "pacer-grokusage"
allowed_hosts = []
# Optional edge dashboard push (see edge/README.md). Disabled by default.
edge_push_enabled = false
# edge_push_url = "https://<WORKER_NAME>.<SUBDOMAIN>.workers.dev/ingest"
# edge_push_secret_file = "~/.secrets/tokencheck-edge-ingest-secret"
